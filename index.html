<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtLogix AI - Agent Control Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #131821;
            --bg-card: #1a1f2e;
            --accent-primary: #00ff88;
            --accent-secondary: #00ccff;
            --text-primary: #e8eaed;
            --text-secondary: #9ba3af;
            --text-muted: #6b7280;
            --border: #2a3142;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --gradient-mesh: radial-gradient(at 20% 30%, rgba(0, 255, 136, 0.15) 0px, transparent 50%),
                             radial-gradient(at 80% 70%, rgba(0, 204, 255, 0.1) 0px, transparent 50%),
                             radial-gradient(at 40% 80%, rgba(99, 102, 241, 0.08) 0px, transparent 50%);
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .background-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: var(--gradient-mesh);
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.3;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            margin-bottom: 3rem;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 24px;
            color: var(--bg-primary);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .system-status {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 255, 136, 0.1);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .stat-change {
            font-size: 0.875rem;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        /* Agent Controls */
        .agents-section {
            margin-bottom: 3rem;
            animation: fadeIn 0.8s ease-out 0.4s both;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .bulk-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--bg-primary);
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--accent-primary);
            background: var(--bg-secondary);
        }

        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .agent-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .agent-card:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 8px 24px rgba(0, 255, 136, 0.1);
        }

        .agent-card.running {
            border-color: var(--accent-primary);
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(0, 255, 136, 0.05) 100%);
        }

        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .agent-info {
            flex: 1;
        }

        .agent-name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .agent-description {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        .agent-toggle {
            position: relative;
            width: 56px;
            height: 32px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .agent-toggle.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        .agent-toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .agent-toggle.active::after {
            left: 26px;
            background: var(--bg-primary);
        }

        .agent-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .agent-stat {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .agent-stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .agent-stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
        }

        .agent-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            flex: 1;
        }

        /* Activity Log */
        .activity-section {
            animation: fadeIn 0.8s ease-out 0.6s both;
        }

        .log-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            max-height: 400px;
            overflow-y: auto;
        }

        .log-container::-webkit-scrollbar {
            width: 8px;
        }

        .log-container::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 4px;
        }

        .log-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .log-container::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }

        .log-entry {
            display: flex;
            gap: 1rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            min-width: 80px;
        }

        .log-message {
            flex: 1;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .log-message .highlight {
            color: var(--accent-primary);
            font-weight: 500;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 23, 0.9);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            animation: modalSlideUp 0.3s ease-out;
        }

        @keyframes modalSlideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            .agents-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Loading spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--bg-secondary);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="background-effects"></div>
    <div class="grid-overlay"></div>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-content">
                <div>
                    <div class="logo">
                        <div class="logo-icon">A</div>
                        <div>
                            <h1>ArtLogix AI</h1>
                            <p class="subtitle">Agent Control Dashboard</p>
                        </div>
                    </div>
                </div>
                <div class="system-status">
                    <div class="status-badge">
                        <span class="status-dot"></span>
                        <span id="systemStatus">System Online</span>
                    </div>
                    <button class="btn btn-secondary" onclick="openConfigModal()">
                        ⚙️ Configure
                    </button>
                </div>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Prospects</div>
                <div class="stat-value" id="totalProspects">0</div>
                <div class="stat-change">↗ Loading...</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Hot Leads (90+)</div>
                <div class="stat-value" id="hotLeads">0</div>
                <div class="stat-change">↗ Loading...</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Qualified (80-89)</div>
                <div class="stat-value" id="qualifiedLeads">0</div>
                <div class="stat-change">↗ Loading...</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Last Run</div>
                <div class="stat-value" id="lastRun" style="font-size: 1.5rem;">Never</div>
                <div class="stat-change" id="lastRunStatus">Awaiting first run</div>
            </div>
        </div>

        <!-- Agent Controls -->
        <section class="agents-section">
            <div class="section-header">
                <h2 class="section-title">Agent Controls</h2>
                <div class="bulk-actions">
                    <button class="btn btn-secondary btn-small" onclick="toggleAllAgents(false)">
                        Disable All
                    </button>
                    <button class="btn btn-primary" onclick="runAllAgents()">
                        ▶️ Run All Agents
                    </button>
                </div>
            </div>

            <div class="agents-grid" id="agentsGrid">
                <!-- Agents will be populated by JavaScript -->
            </div>
        </section>

        <!-- Activity Log -->
        <section class="activity-section">
            <div class="section-header">
                <h2 class="section-title">Activity Log</h2>
                <button class="btn btn-secondary btn-small" onclick="clearLog()">
                    🗑️ Clear
                </button>
            </div>
            <div class="log-container" id="logContainer">
                <div class="log-entry">
                    <div class="log-time">--:--:--</div>
                    <div class="log-message">System initialized. Ready to run agents.</div>
                </div>
            </div>
        </section>
    </div>

    <!-- Configuration Modal -->
    <div class="modal" id="configModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Configuration</h3>
                <button class="modal-close" onclick="closeConfigModal()">×</button>
            </div>
            <form onsubmit="saveConfig(event)">
                <div class="form-group">
                    <label class="form-label">API Endpoint URL</label>
                    <input type="text" class="form-input" id="apiEndpoint" 
                           placeholder="https://your-api.com/run-agents" required>
                </div>
                <div class="form-group">
                    <label class="form-label">API Key (Optional)</label>
                    <input type="password" class="form-input" id="apiKey" 
                           placeholder="Enter your API key">
                </div>
                <div class="form-group">
                    <label class="form-label">Webhook URL (Optional)</label>
                    <input type="text" class="form-input" id="webhookUrl" 
                           placeholder="https://hooks.slack.com/...">
                </div>
                <div style="display: flex; gap: 0.75rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeConfigModal()">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Save Configuration
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Agent definitions
        const agents = [
            {
                id: 'museum',
                name: 'Museum Agent',
                description: '38 major museums nationwide',
                sources: 38,
                enabled: true,
                lastRun: null,
                prospectsFound: 0
            },
            {
                id: 'gallery',
                name: 'Gallery Agent',
                description: '15 blue-chip and mid-tier galleries',
                sources: 15,
                enabled: true,
                lastRun: null,
                prospectsFound: 0
            },
            {
                id: 'auction',
                name: 'Auction Agent',
                description: 'Christie\'s, Sotheby\'s, Phillips',
                sources: 3,
                enabled: true,
                lastRun: null,
                prospectsFound: 0
            },
            {
                id: 'artfair',
                name: 'Art Fair Agent',
                description: 'Art Basel, Frieze, TEFAF, Armory',
                sources: 5,
                enabled: true,
                lastRun: null,
                prospectsFound: 0
            },
            {
                id: 'collector',
                name: 'Collector Agent',
                description: 'Private collector activities',
                sources: 'Search',
                enabled: true,
                lastRun: null,
                prospectsFound: 0
            },
            {
                id: 'press',
                name: 'Press/News Agent',
                description: '6 major art publications',
                sources: 6,
                enabled: true,
                lastRun: null,
                prospectsFound: 0
            }
        ];

        // State
        let config = {
            apiEndpoint: '',
            apiKey: '',
            webhookUrl: ''
        };

        // Initialize
        function init() {
            renderAgents();
            loadConfig();
            loadStats();
            
            // Simulate real-time updates
            setInterval(updateClock, 1000);
        }

        function renderAgents() {
            const grid = document.getElementById('agentsGrid');
            grid.innerHTML = agents.map(agent => `
                <div class="agent-card ${agent.enabled ? 'enabled' : ''}" id="agent-${agent.id}">
                    <div class="agent-header">
                        <div class="agent-info">
                            <h3 class="agent-name">${agent.name}</h3>
                            <p class="agent-description">${agent.description}</p>
                        </div>
                        <div class="agent-toggle ${agent.enabled ? 'active' : ''}" 
                             onclick="toggleAgent('${agent.id}')">
                        </div>
                    </div>
                    <div class="agent-stats">
                        <div class="agent-stat">
                            <span class="agent-stat-label">Sources</span>
                            <span class="agent-stat-value">${agent.sources}</span>
                        </div>
                        <div class="agent-stat">
                            <span class="agent-stat-label">Prospects</span>
                            <span class="agent-stat-value">${agent.prospectsFound}</span>
                        </div>
                    </div>
                    <div class="agent-actions">
                        <button class="btn btn-secondary btn-small" 
                                onclick="runSingleAgent('${agent.id}')"
                                ${!agent.enabled ? 'disabled' : ''}>
                            ▶️ Run
                        </button>
                        <button class="btn btn-secondary btn-small" 
                                onclick="viewAgentLogs('${agent.id}')">
                            📊 Logs
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function toggleAgent(agentId) {
            const agent = agents.find(a => a.id === agentId);
            if (agent) {
                agent.enabled = !agent.enabled;
                renderAgents();
                addLog(`${agent.name} ${agent.enabled ? 'enabled' : 'disabled'}`);
            }
        }

        function toggleAllAgents(state) {
            agents.forEach(agent => agent.enabled = state);
            renderAgents();
            addLog(`All agents ${state ? 'enabled' : 'disabled'}`);
        }

        async function runSingleAgent(agentId) {
            const agent = agents.find(a => a.id === agentId);
            if (!agent || !agent.enabled) return;

            const card = document.getElementById(`agent-${agentId}`);
            card.classList.add('running');
            
            addLog(`Starting ${agent.name}...`);

            try {
                // Simulate API call - replace with actual endpoint
                await simulateAgentRun(agent);
                
                agent.lastRun = new Date();
                agent.prospectsFound = Math.floor(Math.random() * 50) + 10;
                
                renderAgents();
                addLog(`${agent.name} completed. Found ${agent.prospectsFound} prospects.`, 'success');
            } catch (error) {
                addLog(`${agent.name} failed: ${error.message}`, 'error');
            } finally {
                card.classList.remove('running');
            }
        }

        async function runAllAgents() {
            if (!config.apiEndpoint) {
                alert('Please configure your API endpoint first');
                openConfigModal();
                return;
            }

            addLog('Starting all enabled agents...');
            const enabledAgents = agents.filter(a => a.enabled);
            
            for (const agent of enabledAgents) {
                await runSingleAgent(agent.id);
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
            
            loadStats();
            addLog(`All agents completed. Check database for results.`, 'success');
        }

                }, 2000 + Math.random() * 3000);

        function loadStats() {
            // Simulate loading stats from API
            // In production, fetch from your backend
            document.getElementById('totalProspects').textContent = '347';
            document.getElementById('hotLeads').textContent = '58';
            document.getElementById('qualifiedLeads').textContent = '114';
            document.getElementById('lastRun').textContent = formatTime(new Date());
            document.getElementById('lastRunStatus').innerHTML = '↗ <span class="highlight">+89</span> vs last run';
        }

        function addLog(message, type = 'info') {
            const container = document.getElementById('logContainer');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `
                <div class="log-time">${time}</div>
                <div class="log-message">${message}</div>
            `;
            container.insertBefore(entry, container.firstChild);
            
            // Keep only last 50 entries
            while (container.children.length > 50) {
                container.removeChild(container.lastChild);
            }
        }

        function clearLog() {
            document.getElementById('logContainer').innerHTML = '';
            addLog('Log cleared');
        }

        function viewAgentLogs(agentId) {
            const agent = agents.find(a => a.id === agentId);
            addLog(`Viewing logs for ${agent.name}`);
            // In production, open modal with detailed logs
        }

        // Configuration Modal
        function openConfigModal() {
            document.getElementById('configModal').classList.add('active');
            document.getElementById('apiEndpoint').value = config.apiEndpoint;
            document.getElementById('apiKey').value = config.apiKey;
            document.getElementById('webhookUrl').value = config.webhookUrl;
        }

        function closeConfigModal() {
            document.getElementById('configModal').classList.remove('active');
        }

        function saveConfig(event) {
            event.preventDefault();
            config.apiEndpoint = document.getElementById('apiEndpoint').value;
            config.apiKey = document.getElementById('apiKey').value;
            config.webhookUrl = document.getElementById('webhookUrl').value;
            
            localStorage.setItem('artlogix-config', JSON.stringify(config));
            closeConfigModal();
            addLog('Configuration saved successfully');
        }

        function loadConfig() {
            const saved = localStorage.getItem('artlogix-config');
            if (saved) {
                config = JSON.parse(saved);
            }
        }

        // Utility functions
        function formatTime(date) {
            return date.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function updateClock() {
            // Update any time-based displays
        }

        // Initialize on load
        init();
    </script>
